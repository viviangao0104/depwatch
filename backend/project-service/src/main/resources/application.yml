server:
  port: 8081

spring:
  application:
    name: project-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/depwatch_project}
    username: ${SPRING_DATASOURCE_USERNAME:depwatch}
    password: ${SPRING_DATASOURCE_PASSWORD:depwatch}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate          # schema 由 Flyway 管理，JPA 只做校验
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: true

depwatch:
  jwt:
    secret: ${DEPWATCH_JWT_SECRET:change-me-in-prod-this-must-be-at-least-32-bytes-long}
    ttl-hours: 24
    issuer: depwatch
  storage:
    type: ${DEPWATCH_STORAGE_TYPE:local}
    local:
      root: ${DEPWATCH_STORAGE_LOCAL_ROOT:./data/manifests}
    s3:
      bucket: ${DEPWATCH_S3_BUCKET:}
      prefix: manifests
      region: ${AWS_REGION:us-east-1}
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
    max-attempts: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.depwatch: INFO
