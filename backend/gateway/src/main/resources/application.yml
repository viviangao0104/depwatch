server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  cloud:
    gateway:
      default-filters:
        # （客户端伪造的 X-User-* 头在 JwtAuthGlobalFilter 里剥离，它比这里的过滤器先执行）
        # Redis 令牌桶限流：每个用户（未登录则按 IP）每秒 20 个请求，突发 40
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: "#{@principalKeyResolver}"
      routes:
        - id: project-service
          uri: ${DEPWATCH_ROUTES_PROJECT:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/projects/**
        - id: scan-service
          uri: ${DEPWATCH_ROUTES_SCAN:http://localhost:8082}
          predicates:
            - Path=/api/scans/**,/api/vulns/**
        - id: alert-service
          uri: ${DEPWATCH_ROUTES_ALERT:http://localhost:8083}
          predicates:
            - Path=/api/alerts/**
        - id: alert-ws
          # WebSocket：http → ws 协议升级由 Gateway 自动处理
          uri: ${DEPWATCH_ROUTES_ALERT_WS:ws://localhost:8083}
          predicates:
            - Path=/ws/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${DEPWATCH_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      httpclient:
        connect-timeout: 5000
        response-timeout: 60s          # 上传大 lockfile 可能慢

depwatch:
  jwt:
    secret: ${DEPWATCH_JWT_SECRET:change-me-in-prod-this-must-be-at-least-32-bytes-long}
    issuer: depwatch
  security:
    public-paths:
      - /api/auth/register
      - /api/auth/login
      - /actuator/health
      - /actuator/health/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.depwatch: INFO
    org.springframework.cloud.gateway: INFO
